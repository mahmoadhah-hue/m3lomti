<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدوّنة تعلّمي</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2a2e;--mu:#6b777b;--ac:#0f766e;--ac2:#e6f4f1;--bd:#e3e0d8;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13191b;--card:#1c2528;--tx:#e9eeee;--mu:#93a1a4;--ac:#3cc5b6;--ac2:#1d3533;--bd:#2c383b;--bad:#f97066}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:76px;line-height:1.6}
main{max-width:640px;margin:auto;padding:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
h2{margin:6px 0;font-size:18px}h3{margin:4px 0;font-size:15px}
input,textarea,select,button{font:inherit;color:var(--tx)}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;margin:3px 0}
textarea{min-height:70px}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
button.g{background:var(--ac2);color:var(--ac)}button.r{background:transparent;color:var(--bad);padding:4px 8px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>button{flex:0 0 auto}
.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:20px;padding:1px 10px;font-size:12px;margin:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 2px;font-size:12px}nav button.on{color:var(--ac);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{padding:8px 0;border-radius:8px;font-size:14px;cursor:pointer;position:relative}
.cal .h{color:var(--mu);font-size:12px;cursor:default}.cal .t{border:1px solid var(--ac)}.cal .s{background:var(--ac);color:#fff}
.cal .d::after{content:"";position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:var(--ac)}.cal .s.d::after{background:#fff}
.bar{height:8px;background:var(--ac2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
details summary{cursor:pointer;color:var(--ac);padding:4px 0}
.big{font-size:32px;font-weight:700;color:var(--ac)}
</style></head><body><main id="m"></main>
<nav id="nv"></nav>
<script>
const $=s=>document.querySelector(s);
let S=null;try{S=JSON.parse(localStorage.getItem('tadwin1')||'null')}catch(e){}
S=S||{e:[],g:{},x:[],ch:null};
const save=()=>{try{localStorage.setItem('tadwin1',JSON.stringify(S))}catch(e){}};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TD=iso(new Date());let sel=TD,tab='day',cm=new Date();cm.setDate(1);
let rv=null,show=false,q='',ff='';
const F=['علوم','مهارة','لغات','أخرى'];
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const byId=id=>S.e.find(x=>x.id==id);
const AR=new Intl.DateTimeFormat('ar',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fd=s=>AR.format(new Date(s+'T12:00:00'));
function streak(){let n=0,d=TD;if(!S.e.some(x=>x.date==d))d=addD(d,-1);while(S.e.some(x=>x.date==d)){n++;d=addD(d,-1)}return n}
function go(t){tab=t;show=false;rv=null;render()}
function render(){
 const T=[['day','اليوم'],['cal','التقويم'],['rev','مراجعة'],['kn','معرفتي'],['st','إنجاز'],['ex','قائمة']];
 $('#nv').innerHTML=T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 $('#m').innerHTML=({day:vDay,cal:vCal,rev:vRev,kn:vKn,st:vSt,ex:vEx})[tab]();
}
function card(x,full){
 const L=(x.links||[]).map(i=>byId(i)).filter(Boolean);
 return `<div class="c"><div class="row"><h3>${esc(x.title)}</h3><button class="r" onclick="del('${x.id}')">حذف</button></div>
 <span class="tag">${esc(x.field)}</span>${x.diff?`<span class="tag">${x.diff=='h'?'صعب':'سهل'}</span>`:''}${x.source?`<span class="mu">المصدر: ${esc(x.source)}</span>`:''}
 <div style="white-space:pre-wrap">${esc(x.points)}</div>
 ${x.simple?`<div class="mu">🧒 بالبساطة: ${esc(x.simple)}</div>`:''}
 ${x.mistake?`<div class="mu">⚠️ خطأ: ${esc(x.mistake)}${x.fix?' ← الحل: '+esc(x.fix):''}</div>`:''}
 ${x.action?`<div class="mu">🎯 تطبيق خلال 24 ساعة: ${esc(x.action)}</div>`:''}
 ${L.length?`<div class="mu">🔗 ${L.map(l=>`<span class="tag">${esc(l.title)}</span>`).join('')}</div>`:''}
 <div class="row"><button class="g" onclick="post('${x.id}')">منشور 📣</button>
 <select onchange="link('${x.id}',this.value)"><option value="">اربط بملاحظة…</option>${S.e.filter(o=>o.id!=x.id&&!(x.links||[]).includes(o.id)).map(o=>`<option value="${o.id}">${esc(o.title)}</option>`).join('')}</select></div></div>`}
function vDay(){
 const g=S.g[sel]||{};const es=S.e.filter(x=>x.date==sel);
 const cap=S.e.filter(x=>x.date.slice(5)==sel.slice(5)&&x.date<sel);
 return `<div class="row"><button class="g" onclick="sel=addD(sel,1);render()">›</button><h2 style="flex:1;text-align:center">${fd(sel)}</h2><button class="g" onclick="sel=addD(sel,-1);render()">‹</button></div>
 <div class="c"><h3>🎯 هدف اليوم</h3><div class="row"><input id="gl" placeholder="شو ناوي تتعلم اليوم؟" value="${esc(g.t)}"><button onclick="setG()">حفظ</button></div>
 ${g.t?`<label class="row" style="margin-top:6px"><input type="checkbox" style="width:auto;flex:0" ${g.ok?'checked':''} onchange="S.g[sel].ok=this.checked;save();render()"> أكدت إنجازه مساءً</label>`:''}</div>
 ${cap.length?`<div class="c" style="background:var(--ac2)"><h3>⏳ كبسولة الزمن</h3>${cap.map(x=>`<div>قبل ${sel.slice(0,4)-x.date.slice(0,4)} سنة: <b>${esc(x.title)}</b></div>`).join('')}</div>`:''}
 <div class="c"><h3>➕ تدوين جديد</h3>
 <input id="ti" placeholder="العنوان / الموضوع">
 <div class="row"><select id="fl">${F.map(f=>`<option>${f}</option>`).join('')}</select><input id="so" placeholder="المصدر"></div>
 <textarea id="pt" placeholder="ما تعلمته (نقاط، سطر لكل نقطة)"></textarea>
 <div class="row"><button class="g" id="mic" onclick="mic()">🎙️ تسجيل صوتي (دقيقة)</button>
 <select id="df"><option value="">الصعوبة</option><option value="e">سهل</option><option value="h">صعب</option></select></div>
 <details><summary>شرح بسيط (فينمان)، خطأ وحل، تطبيق عملي</summary>
 <textarea id="sm" placeholder="اشرحها كأنك تشرح لطفل"></textarea>
 <input id="mk" placeholder="خطأ واجهته"><input id="fx" placeholder="كيف حليته؟">
 <input id="ac" placeholder="خطوة عملية أطبقها خلال 24 ساعة"></details>
 <button style="width:100%;margin-top:6px" onclick="add()">حفظ التدوينة</button></div>
 <h2>تدويناتي (${es.length})</h2>${es.map(x=>card(x)).join('')||'<div class="mu">ما في تدوينات بهاليوم.</div>'}`}
function setG(){S.g[sel]={...(S.g[sel]||{}),t:$('#gl').value.trim()};save();render()}
function add(){const t=$('#ti').value.trim(),p=$('#pt').value.trim();if(!t&&!p){alert('اكتب عنوان أو نقاط');return}
 S.e.push({id:uid(),date:sel,title:t||p.slice(0,30),field:$('#fl').value,source:$('#so').value.trim(),points:p,diff:$('#df').value,simple:$('#sm').value.trim(),mistake:$('#mk').value.trim(),fix:$('#fx').value.trim(),action:$('#ac').value.trim(),links:[],r:{n:0,next:addD(sel,1)}});save();render()}
function del(id){if(confirm('حذف التدوينة؟')){S.e=S.e.filter(x=>x.id!=id);S.e.forEach(x=>x.links=(x.links||[]).filter(l=>l!=id));save();render()}}
function link(id,o){if(!o)return;const a=byId(id),b=byId(o);a.links=[...(a.links||[]),o];b.links=[...(b.links||[]),id];save();render()}
let rec=null;
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('المتصفح ما بدعم التحويل من صوت لنص');return}
 if(rec){rec.stop();return}rec=new R();rec.lang='ar';rec.continuous=true;rec.interimResults=false;
 const b=$('#mic');b.textContent='⏹️ إيقاف التسجيل';
 rec.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript+' ';$('#pt').value+=($('#pt').value?'\n':'')+s.trim()};
 const end=()=>{clearTimeout(tm);rec=null;const b=$('#mic');if(b)b.textContent='🎙️ تسجيل صوتي (دقيقة)'};
 rec.onend=end;rec.onerror=end;const tm=setTimeout(()=>rec&&rec.stop(),60000);rec.start()}
function post(id){const x=byId(id);const t=`💡 تعلمت اليوم: ${x.title}\n\n${x.points.split('\n').filter(Boolean).map(l=>'• '+l).join('\n')}${x.simple?'\n\nبالمختصر: '+x.simple:''}\n\n#تعلم #${x.field}`;
 if(navigator.share){navigator.share({text:t}).catch(()=>{})}else{try{navigator.clipboard.writeText(t).then(()=>alert('اننسخ النص ✅'))}catch(e){prompt('انسخ النص:',t)}}}
function vCal(){
 const y=cm.getFullYear(),mo=cm.getMonth(),f=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate();
 const hd=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'].map(d=>`<div class="h">${d}</div>`).join('');
 let c='<div></div>'.repeat(f);
 for(let i=1;i<=n;i++){const d=iso(new Date(y,mo,i));c+=`<div class="${d==TD?'t ':''}${d==sel?'s ':''}${S.e.some(x=>x.date==d)||(S.g[d]&&S.g[d].t)?'d':''}" onclick="sel='${d}';render()">${i}</div>`}
 const es=S.e.filter(x=>x.date==sel);
 return `<div class="c"><div class="row"><button class="g" onclick="cm.setMonth(cm.getMonth()+1);render()">›</button><h2 style="flex:1;text-align:center">${new Intl.DateTimeFormat('ar',{month:'long',year:'numeric'}).format(cm)}</h2><button class="g" onclick="cm.setMonth(cm.getMonth()-1);render()">‹</button></div>
 <div class="cal">${hd}${c}</div><div class="mu" style="margin-top:6px">تقويم بلا حدود، تنقّل لأي شهر أو سنة.</div></div>
 <div class="c"><h3>${fd(sel)}</h3>${S.g[sel]&&S.g[sel].t?`<div>🎯 ${esc(S.g[sel].t)} ${S.g[sel].ok?'✅':''}</div>`:''}
 ${es.map(x=>`<div>• <b>${esc(x.title)}</b> <span class="tag">${esc(x.field)}</span></div>`).join('')||'<div class="mu">لا يوجد تدوينات</div>'}
 <button style="margin-top:8px" onclick="go('day')">فتح اليوم وإضافة تدوين</button></div>`}
function vRev(){
 const due=S.e.filter(x=>!x.r||x.r.next<=TD).sort((a,b)=>(b.diff=='h')-(a.diff=='h'));
 if(!due.length)return `<div class="c"><h2>🧠 المراجعة</h2>خلصت مراجعات اليوم 🎉<div class="mu">كل تدوينة بترجع بفترات متباعدة: 1، 3، 7، 14، 30 يوم…</div></div>`;
 const x=rv?byId(rv)||due[0]:due[0];rv=x.id;
 return `<div class="c"><div class="mu">متبقي ${due.length} بطاقة</div><h2>${esc(x.title)}</h2><span class="tag">${esc(x.field)}</span>
 ${show?`<div style="white-space:pre-wrap;margin:8px 0">${esc(x.points)}${x.simple?'\n\n🧒 '+esc(x.simple):''}</div>
 <div class="row"><button onclick="rate('e')">سهل ✅</button><button class="g" onclick="rate('h')">صعب 😵</button></div>`:
 `<p class="mu">حاول تتذكر النقاط، ثم اعرض الجواب.</p><button onclick="show=true;render()">اعرض الجواب</button>`}</div>`}
function rate(k){const x=byId(rv);const I=[1,3,7,14,30,60];x.diff=k;if(k=='e'){x.r.n=Math.min((x.r.n||0)+1,5)}else x.r.n=0;
 x.r.next=addD(TD,I[x.r.n]);save();show=false;rv=null;render()}
function vKn(){
 const l=q.toLowerCase();const es=S.e.filter(x=>(!ff||x.field==ff)&&(!l||[x.title,x.points,x.source,x.simple,x.mistake,x.fix].join(' ').toLowerCase().includes(l))).sort((a,b)=>b.date.localeCompare(a.date));
 return `<h2>🔗 معرفتي (${S.e.length})</h2><input placeholder="ابحث بكلمة…" value="${esc(q)}" oninput="q=this.value;clearTimeout(window.st);window.st=setTimeout(()=>{render();const i=document.querySelector('input[placeholder^=ابحث]');i.focus();i.setSelectionRange(99,99)},300)">
 <div class="row" style="margin:4px 0"><button class="${ff?'g':''}" onclick="ff='';render()">الكل</button>${F.map(f=>`<button class="${ff==f?'':'g'}" onclick="ff='${f}';render()">${f}</button>`).join('')}</div>
 ${es.map(x=>`<div class="mu" style="margin-top:8px">${x.date}</div>`+card(x)).join('')||'<div class="mu">ما في نتائج.</div>'}`}
function vSt(){
 const cnt=n=>{const from=addD(TD,-n+1);const r={};F.forEach(f=>r[f]=0);S.e.filter(x=>x.date>=from).forEach(x=>r[x.field]=(r[x.field]||0)+1);return r};
 const rp=(t,n)=>{const r=cnt(n),tot=Object.values(r).reduce((a,b)=>a+b,0);return `<div class="c"><h3>${t}: ${tot} تدوينة</h3>${Object.entries(r).map(([k,v])=>`<div class="row"><span style="flex:0 0 60px">${k}</span><div class="bar"><i style="width:${tot?v/tot*100:0}%"></i></div><span style="flex:0 0 24px">${v}</span></div>`).join('')}</div>`};
 let ch='';if(S.ch){const days=[...Array(30)].map((_,i)=>addD(S.ch,i));const done=days.filter(d=>S.e.some(x=>x.date==d)).length;
  ch=`<div class="c"><h3>🏆 تحدي 30 يوم</h3><div class="bar"><i style="width:${done/30*100}%"></i></div><div class="mu">${done} من 30 يوم (بدأ ${S.ch})</div><button class="r" onclick="S.ch=null;save();render()">إلغاء التحدي</button></div>`}
 else ch=`<div class="c"><h3>🏆 تحدي 30 يوم</h3><button onclick="S.ch=TD;save();render()">ابدأ التحدي اليوم</button></div>`;
 const g=Object.values(S.g).filter(x=>x.t),ok=g.filter(x=>x.ok).length;
 const dots=[...Array(35)].map((_,i)=>{const d=addD(TD,i-34);return `<span style="display:inline-block;width:14px;height:14px;margin:2px;border-radius:4px;background:${S.e.some(x=>x.date==d)?'var(--ac)':'var(--ac2)'}"></span>`}).join('');
 return `<div class="c"><div class="big">🔥 ${streak()}</div>يوم متواصل<div style="margin-top:6px">${dots}</div></div>
 ${rp('هذا الأسبوع',7)}${rp('هذا الشهر',30)}
 <div class="c">🎯 أهداف مؤكدة: ${ok} من ${g.length}</div>${ch}
 <div class="c"><h3>مشاركة / نسخ احتياطي</h3><div class="row"><button class="g" onclick="exp()">نسخ كل تدويناتي كنص</button></div></div>`}
function exp(){const t=S.e.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`${x.date} | ${x.field} | ${x.title}\n${x.points}`).join('\n\n');
 try{navigator.clipboard.writeText(t).then(()=>alert('اننسخ ✅'))}catch(e){prompt('انسخ:',t)}}
function vEx(){
 return `<h2>📋 القائمة الخارجية</h2><div class="mu">قائمة عامة مو مربوطة بيوم (كتب، دورات، أفكار تتعلمها لاحقاً).</div>
 <div class="row" style="margin:6px 0"><input id="xi" placeholder="أضف عنصر…" onkeydown="if(event.key=='Enter')addX()"><button onclick="addX()">إضافة</button></div>
 ${S.x.map(i=>`<div class="c row"><input type="checkbox" style="width:auto;flex:0" ${i.d?'checked':''} onchange="togX('${i.id}')"><span style="${i.d?'text-decoration:line-through;color:var(--mu)':''}">${esc(i.t)}</span><button class="r" onclick="S.x=S.x.filter(z=>z.id!='${i.id}');save();render()">حذف</button></div>`).join('')||'<div class="mu">القائمة فاضية.</div>'}`}
function addX(){const v=$('#xi').value.trim();if(!v)return;S.x.unshift({id:uid(),t:v,d:false});save();render()}
function togX(id){const i=S.x.find(z=>z.id==id);i.d=!i.d;save();render()}
render();
</script></body></html>
